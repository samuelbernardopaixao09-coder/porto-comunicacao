<style>

<header><div class="logo"></div><h1>PORTO COMUNICAÇÃO<small>Atendimento · propostas · pedidos</small></h1><div class="sp"></div><button class="btn gh" onclick="carregar()">↻</button></header>
<nav id="nav"></nav>
<main id="app"><div class="empty">Carregando…</div></main>
<dialog id="dlg"><form class="dl" onsubmit="enviarAlt(event)"><h3 id="dlgT">Pedir alteração</h3><p class="mut">Escreva o que mudar (ex.: valor 250, quantidade 3, tirar a instalação).</p><textarea name="t" rows="3" required></textarea><div class="acts" style="justify-content:flex-end"><button type="button" class="btn mid" onclick="dlg.close()">Cancelar</button><button class="btn pri">Enviar</button></div></form></dialog>
<div id="toast"></div>
<script>
const API='https://portocomunicacao.app.n8n.cloud/webhook/app-porto';let K='',U='';try{K=localStorage.getItem('ppk')||'';U=localStorage.getItem('pu')||''}catch(e){}
const ADM=()=>!U||U=='admin';const NOMES={admin:'Administrador',comercial:'Comercial',financeiro:'Financeiro',producao:'Produção'};
let D=null,TAB='aprovar',BUSCA='',ALT=null,CH='wa';try{CH=localStorage.getItem('pch')||'wa'}catch(e){}
const EM=()=>CH=='mail';try{TAB=localStorage.getItem('ptab')||'aprovar'}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{if(typeof v==='number')return v;const s=String(v||'').replace(/[^\d,.-]/g,'');return Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)||0};
const dt=t=>t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const tel=f=>{const d=String(f||'').replace(/\D/g,'');return d.length>=12?'('+d.slice(2,4)+') '+d.slice(4,-4)+'-'+d.slice(-4):f};
const nomeDe=c=>c.nome||c.empresa||tel(c.fone||c.mail);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200)}
function login(msg){document.querySelector('header').style.display='none';document.getElementById('nav').style.display='none';document.getElementById('app').innerHTML='<form class="login" onsubmit="entrar(event)"><div class="logo" style="margin:0 auto;width:90px;height:90px;border-radius:22px"></div><h3>Porto Comunicação</h3>'+(msg?'<div style="color:var(--bad)">'+esc(msg)+'</div>':'')+'<select name="u" style="width:100%;padding:12px;border-radius:10px;border:1px solid #d6dae1;font:inherit;background:#fff">'+['comercial','financeiro','producao','admin'].map(u=>'<option value="'+u+'"'+(u==(U||'comercial')?' selected':'')+'>'+NOMES[u]+'</option>').join('')+'</select><input name="s" type="password" placeholder="Senha" autocomplete="current-password" autofocus><button class="btn pri" style="width:100%">Entrar</button></form>'}
async function entrar(e){e.preventDefault();const f=e.target,u=f.u.value,p=f.s.value;if(!p)return;const b=f.querySelector('button');b.disabled=true;try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({a:'login',u,p})});const j=await r.json().catch(()=>({}));if(!j.ok||!j.token){b.disabled=false;return login(j.erro||'Não consegui entrar')}K=j.token;U=j.u;try{localStorage.setItem('ppk',K);localStorage.setItem('pu',U)}catch(x){}document.querySelector('header').style.display='';document.getElementById('nav').style.display='';carregar()}catch(x){b.disabled=false;login('Sem conexão. Tente de novo.')}}
async function carregarUsuarios(){const box=document.getElementById('us-list');try{const r=await fetch(API+'?k='+encodeURIComponent(K),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({a:'users'})});const j=await r.json();if(!j.ok)throw new Error(j.erro||r.status);box.className='';box.innerHTML=j.users.map(x=>'<div class="card" style="margin:10px 0 0;box-shadow:none;border:1px solid #e3e6ea"><div class="row"><h3>'+esc(x.nome)+'</h3><span class="tag '+(x.temSenha?'t-pag':'t-est')+'">'+(x.temSenha?'Senha definida':'Sem senha')+'</span><span class="sp"></span><span class="mut">'+(x.temSenha?'usuário: '+esc(x.nome)+(x.atualizado?' · senha de '+dt(x.atualizado):'')+' · '+x.sessoes+' aparelho(s) logado(s)':'ainda não consegue entrar')+'</span></div><form class="row" style="margin-top:8px" onsubmit="salvarSenha(event,\''+x.u+'\')"><input name="p" type="password" autocomplete="new-password" minlength="6" placeholder="'+(x.temSenha?'Nova senha (mín. 6)':'Criar senha (mín. 6)')+'" style="flex:1;min-width:160px"><button class="btn pri">Salvar senha</button>'+(x.temSenha?'<button type="button" class="btn bad" onclick="tirarSenha(\''+x.u+'\',\''+esc(x.nome)+'\')">Bloquear acesso</button>':'')+'</form></div>').join('')}catch(e){box.textContent='Não consegui carregar os usuários ('+e.message+').'}}
async function salvarSenha(e,u){e.preventDefault();const p=e.target.p.value;if(p.length<6){toast('A senha precisa ter pelo menos 6 caracteres');return}await acao({a:'setuser',u,p},'🔑 Senha de '+NOMES[u]+' salva');e.target.p.value='';carregarUsuarios()}
async function tirarSenha(u,n){if(!confirm('Bloquear o acesso de '+n+'? Quem estiver logado sai, e o setor só volta a entrar quando você criar uma senha nova.'))return;await acao({a:'setuser',u,limpar:true},'🔒 Acesso de '+n+' bloqueado');carregarUsuarios()}
function sair(){if(!confirm('Sair do app?'))return;K='';U='';try{localStorage.removeItem('ppk');localStorage.removeItem('pu')}catch(e){}login()}
async function carregar(){if(!K)return login();try{const r=await fetch(API+'?k='+encodeURIComponent(K));if(r.status==401){try{localStorage.removeItem('ppk')}catch(e){}K='';return login(U&&U!='admin'?'Sua sessão expirou ou a senha mudou. Entre de novo.':'Senha incorreta')}D=await r.json();render()}catch(e){document.getElementById('app').innerHTML='<div class="card empty">Não consegui carregar ('+esc(e.message)+'). Toque em ↻.</div>'}}
async function acao(body,okMsg){try{const r=await fetch(API+'?k='+encodeURIComponent(K),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.erro||r.status);toast(okMsg);setTimeout(carregar,5000)}catch(e){toast('Erro: '+e.message)}}
const pdf=pk=>window.open(API+'?a=pdf&pk='+encodeURIComponent(pk)+'&k='+encodeURIComponent(K),'_blank');
function aprovar(pk){if(confirm('Enviar a proposta Nº '+pk+' para o cliente?'))acao({a:EM()?'eok':'ok',pk},'✅ Proposta '+pk+' enviada ao cliente')}
function recusar(pk){if(confirm('Descartar a proposta Nº '+pk+' (não envia ao cliente)?'))acao({a:EM()?'enao':'nao',pk},'Proposta '+pk+' descartada')}
function alterar(pk){ALT=pk;document.getElementById('dlgT').textContent='Alterar proposta Nº '+pk;dlg.querySelector('textarea').value='';dlg.showModal()}
function enviarAlt(e){e.preventDefault();const t=e.target.t.value.trim();dlg.close();acao({a:EM()?'ealterar':'alterar',pk:ALT,texto:t},'✏️ Pedido de alteração enviado. A nova versão aparece em instantes.')}
function iaRetoma(f){if(confirm('A IA vai reassumir '+(EM()?'o atendimento por e-mail de ':'a conversa com ')+tel(f)+' e responder agora. Confirmar?'))acao(EM()?{a:'eia',mail:f}:{a:'ia',fone:f},'🤖 IA reassumiu a conversa')}
function orc(f){if(confirm('Montar agora a proposta de '+tel(f)+' com o que já foi conversado?'))acao(EM()?{a:'eorc',mail:f}:{a:'orc',fone:f},'📄 Montando a proposta… ela aparece em "Aprovar"')}
function pago(pk){if(confirm('Marcar a proposta Nº '+pk+' como PAGA?'))acao({a:EM()?'epago':'pago',pk},'💰 Proposta '+pk+' marcada como paga')}
function os(pk){window.open('https://portocomunicacao.app.n8n.cloud/webhook/os?k='+encodeURIComponent(K)+'&n='+encodeURIComponent(pk),'_blank')}
function novoOrc(e){e.preventDefault();const t=document.getElementById('no-texto').value.trim();if(t.length<5){toast('Descreva o pedido');return}const n=document.getElementById('no-nome').value.trim(),f=document.getElementById('no-fone').value.trim(),em=document.getElementById('no-email').value.trim();if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast('Confira o e-mail do cliente');return}document.getElementById('no-btn').disabled=true;CH='wa';try{localStorage.setItem('pch','wa')}catch(x){}acao({a:'novo',texto:(t+TXTS.map(x=>'\n\n[ARQUIVO ANEXADO: '+x.nome+']\n'+x.texto).join('')).slice(0,30000),nome:n,fone:f,email:em,imgs:IMGS.slice(0,12),imgLeg:IMGS.slice(0,12).map(u=>(window.__LEG||{})[u.length+':'+u.slice(-48)]||''),docs:DOCS.slice(0,3)},'📄 Gerando o orçamento… ele aparece em Aprovar em cerca de 1 minuto');IMGS=[];DOCS=[];TXTS=[];setTimeout(()=>setTab('aprovar'),800);setTimeout(carregar,45000);setTimeout(carregar,75000)}
let PRE=null,NV={},NVi=0,IMGS=[],DOCS=[],TXTS=[],NOMODO='ia',PDFF='';
function modoBar(){return '<div class="card" style="padding:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn '+(NOMODO=='ia'?'pri':'mid')+'" onclick="NOMODO=\'ia\';render()">🤖 Gerar com a IA</button><button class="btn '+(NOMODO=='fora'?'pri':'mid')+'" onclick="NOMODO=\'fora\';render()">📥 Registrar orçamento feito por fora</button><button class="btn '+(NOMODO=='busca'?'pri':'mid')+'" onclick="NOMODO=\'busca\';render()">🔎 Buscar orçamento</button></div>'}
let BQ='';
function todosOrc(){const all=[];for(const [ch,X] of [['wa',D||{}],['mail',(D&&D.mail)||{}]]){for(const p of (X.pend||[]))all.push(Object.assign({},p,{_pend:true,_ch:ch,desc:(p.itens||[]).map(i=>i.q+'× '+i.d).join('; ')}));for(const p of (X.pedidos||[]))all.push(Object.assign({},p,{_ch:ch}))}return all.sort((a,b)=>(Number(b.pk)||0)-(Number(a.pk)||0)||b.t-a.t)}
function stOrc(p){return p._pend?['Aguardando aprovação','t-est']:p.pago?['Paga','t-pag']:p.aprovado?['Aprovada','t-ia']:p.externo?['Feito por fora','t-env']:['Enviada','t-env']}
let LIMO=20;
function cardOrc(p){const s=stOrc(p);const nome=p.nome||p.empresa||(/^manual/.test(String(p.cli))?'Orçamento avulso':tel(p.cli));return '<div class="card"><div class="row"><h3>'+esc(nome)+'</h3><span class="tag '+s[1]+'">'+s[0]+'</span>'+(p.ia?'<span class="tag t-est">🤖 detectado pela IA</span>':'')+'<span class="sp"></span><span class="mut">'+dt(p.t)+'</span></div><div class="mut">Nº '+esc(p.pk)+' · '+(p._ch=='mail'?'✉️ ':'💬 ')+esc(/^manual/.test(String(p.cli))?'sem contato':tel(p.cli))+(p.empresa&&p.empresa!=nome?' · '+esc(p.empresa):'')+'</div><div style="margin-top:8px;font-size:14px">'+esc(String(p.desc||'').slice(0,500))+'</div><div class="mut" style="margin-top:6px">Valor: <b style="color:var(--ink,#111)">'+esc(p.total||'a confirmar')+'</b></div><div class="acts"><button class="btn mid" onclick="pdf(\''+p.pk+'\')">📄 PDF</button><button class="btn mid" onclick="editar(\''+p.pk+'\')">📝 Editar</button>'+(p._pend?'':'<button class="btn mid" onclick="os(\''+p.pk+'\')">🛠️ Ordem de Serviço</button>')+convBtn(p.cli,p.nome)+'<button class="btn mid" onclick="CH=\''+p._ch+'\';setTab(\''+(p._pend?'aprovar':'pedidos')+'\')">Ir para '+(p._pend?'Aprovar':'Pedidos')+'</button>'+nvBtn(nome,p._ch=='mail'?'':p.cli,'Baseado no orçamento Nº '+p.pk+': '+String(p.desc||'')+'\n\nNovo pedido / o que muda: ')+'</div></div>'}
function listaOrc(){const all=todosOrc();if(!all.length)return '';return '<h3 style="margin:18px 4px 8px">Todos os orçamentos ('+all.length+') <span class="mut" style="font-weight:400;font-size:13px">do mais novo para o mais antigo</span></h3>'+all.slice(0,LIMO).map(cardOrc).join('')+(all.length>LIMO?'<div style="text-align:center;margin:10px"><button class="btn mid" onclick="LIMO+=20;render()">Mostrar mais ('+(all.length-LIMO)+')</button></div>':'')}
function buscaOrc(){const q=BQ.trim().toLowerCase();const qn=q.replace(/\D/g,'');const st=stOrc;const all=todosOrc();if(!q)return '';const r=all.filter(p=>(qn&&String(p.pk)===qn)||(q.length>=3&&((p.nome||'')+' '+(p.empresa||'')+' '+(p.cli||'')+' '+(p.desc||'')).toLowerCase().includes(q))).sort((a,b)=>(String(b.pk)===qn)-(String(a.pk)===qn)||b.t-a.t).slice(0,30);if(!r.length)return '<div class="card empty">Nenhum orçamento encontrado para “'+esc(BQ)+'”.</div>';return r.map(cardOrc).join('')}
function pdfFora(inp){const f=(inp.files||[])[0];inp.value='';if(!f)return;if(f.size>2000000){toast('PDF maior que 2 MB');return}const fr=new FileReader();fr.onload=()=>{PDFF=fr.result;const s=document.getElementById('rf-pdf');if(s)s.textContent='✔ '+f.name};fr.readAsDataURL(f)}
async function registrarFora(e){e.preventDefault();const g=id=>document.getElementById(id).value.trim();const fone=g('rf-fone'),email=g('rf-email'),desc=g('rf-desc');if(!fone&&!email){toast('Informe o WhatsApp ou o e-mail do cliente');return}if(desc.length<3){toast('Descreva o que foi orçado');return}document.getElementById('rf-btn').disabled=true;try{const r=await fetch(API+'?k='+encodeURIComponent(K),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({a:'registrar',nome:g('rf-nome'),empresa:g('rf-empresa'),fone,email,total:g('rf-total'),numero:g('rf-num'),desc,pdf:PDFF})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.erro||r.status);toast('📥 Orçamento registrado como Nº '+j.pk+'. Cliente em Atendimentos.');PDFF='';NOMODO='ia';CH=j.canal=='mail'?'mail':'wa';try{localStorage.setItem('pch',CH)}catch(x){}await carregar();setTab('atend')}catch(x){toast('Erro: '+x.message);const b=document.getElementById('rf-btn');if(b)b.disabled=false}}
function jpg(file){return new Promise((ok,er)=>{const fr=new FileReader();fr.onerror=er;fr.onload=()=>{const im=new Image();im.onerror=er;im.onload=()=>{let w=im.width,h=im.height,M=1400;if(w>M||h>M){const s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let q=.8,u=c.toDataURL('image/jpeg',q);while(u.length>520000&&q>.35){q-=.1;u=c.toDataURL('image/jpeg',q)}ok(u)};im.src=fr.result};fr.readAsDataURL(file)})}
function carregaLib(src,glob){return new Promise((ok,er)=>{if(window[glob])return ok(window[glob]);const s=document.createElement('script');s.src=src;s.onload=()=>ok(window[glob]);s.onerror=()=>er(new Error('não consegui carregar o leitor de arquivo'));document.head.appendChild(s)})}
function lerComo(f,modo){return new Promise((ok,er)=>{const fr=new FileReader();fr.onerror=er;fr.onload=()=>ok(fr.result);if(modo=='url')fr.readAsDataURL(f);else if(modo=='buf')fr.readAsArrayBuffer(f);else fr.readAsText(f)})}

function prev(){$('chPrev').innerHTML=ANX.imgs.slice(0,8).map(u=>'<img src="'+u+'">').join('')+ANX.docs.map(d=>'<span>📄 '+es(d.nome)+'</span>').join('')+ANX.txts.map(t=>'<span>📝 '+es(t.nome)+'</span>').join('')+((ANX.imgs.length+ANX.docs.length+ANX.txts.length)?'<span style="cursor:pointer" id="chTira">✕ tirar</span>':'');const x=$('chTira');if(x)x.onclick=()=>{ANX=vazio();prev()}}
async function anexar(inp){const bak=[IMGS.slice(),DOCS.slice(),TXTS.slice()];IMGS.length=0;DOCS.length=0;TXTS.length=0;
  try{await addImgs(inp);IMGS.forEach(u=>{ANX.imgs.push(u);ANX.legs[u.length+':'+u.slice(-48)]=(window.__LEG||{})[u.length+':'+u.slice(-48)]||''});DOCS.forEach(d=>ANX.docs.push(d));TXTS.forEach(t=>ANX.txts.push(t))}catch(e){toast('Erro ao anexar: '+e.message)}
  finally{IMGS.length=0;DOCS.length=0;TXTS.length=0;bak[0].forEach(x=>IMGS.push(x));bak[1].forEach(x=>DOCS.push(x));bak[2].forEach(x=>TXTS.push(x));try{verImgs()}catch(e){}prev();$('chIn').focus()}}
fab.onclick=()=>{box.classList.toggle('on');if(box.classList.contains('on')){render();setTimeout(()=>$('chIn').focus(),50)}};
$('chX').onclick=()=>box.classList.remove('on');
$('chLimpa').onclick=()=>{if(H.length&&!confirm('Apagar esta conversa com o assistente?'))return;H=[];salvar();render()};
$('chEnv').onclick=enviar;$('chFile').onchange=e=>anexar(e.target);
$('chIn').addEventListener('paste',e=>{const fs=[...((e.clipboardData||{}).files||[])];if(fs.length){e.preventDefault();anexar({files:fs})}});
box.addEventListener('dragover',e=>{e.preventDefault();box.style.outline='3px dashed #0b5cad'});box.addEventListener('dragleave',()=>box.style.outline='');box.addEventListener('drop',e=>{e.preventDefault();box.style.outline='';const fs=[...((e.dataTransfer||{}).files||[])];if(fs.length)anexar({files:fs})});
$('chIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar()}});
$('chIn').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'});
})();
</script>
</body></html>
