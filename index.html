<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--pri:#e6007e;--cy:#00aeef;--ye:#ffd200;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--top:#111827}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--top);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{width:40px;height:40px;border-radius:12px;background:url(icon-192.png) center/cover;flex:none}
header h1{font-size:16px;margin:0}header small{display:block;color:#9ca3af;font-size:12px;font-weight:400}.sp{flex:1}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}.btn.pri{background:var(--pri);color:#fff}.btn.gh{background:transparent;color:inherit;border:1px solid #374151}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:#fff;color:var(--bad);border:1px solid #fecaca}.btn.mid{background:#fff;color:var(--ink);border:1px solid var(--line)}
nav{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:4;overflow-x:auto}
nav button{border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;font-size:14px}nav button.on{background:var(--top);color:#fff}
.chs{display:flex;gap:4px;background:#f3f4f6;border-radius:999px;padding:3px;margin-right:6px;flex:none}.chs button{padding:6px 12px}.chs button.on{background:var(--pri)}.sep{width:1px;background:var(--line);margin:4px 4px;flex:none}
nav .ct{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--pri);color:#fff;font-size:11px;line-height:18px}
main{max-width:1000px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}
.card h3{margin:0 0 4px;font-size:16px}.mut{color:var(--mut);font-size:13px}.big{font-size:22px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.it{font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}.it:last-child{border:0}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}.t-ia{background:#e0f2fe;color:#075985}.t-hum{background:#fef3c7;color:#92400e}.t-pag{background:#dcfce7;color:#166534}.t-env{background:#ede9fe;color:#5b21b6}.t-est{background:#fee2e2;color:#991b1b}
.msg{font-size:13px;padding:6px 10px;border-radius:10px;margin:4px 0;max-width:92%;white-space:pre-wrap;word-break:break-word}.msg.c{background:#f3f4f6}.msg.a{background:#fdf2f8;margin-left:auto}
details summary{cursor:pointer;color:var(--cy);font-size:13px;margin-top:8px}
input,textarea,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase}.kpi .v{font-size:20px;font-weight:700;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:24px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--top);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90vw}
dialog{border:0;border-radius:16px;padding:0;width:min(460px,94vw)}dialog::backdrop{background:rgba(0,0,0,.5)}.dl{padding:18px}
.login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}.login input{margin:12px 0}
.svg text{font-size:10px;fill:#6b7280}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}header small{display:none}.kpi .v{font-size:17px}nav{top:60px}}
</style><style id="tema-azul">
/* ===== Tema A azul (Porto) ===== */
:root{--az:#0b4ea2;--az2:#083b7c;--azc:#c9d8f2;--top:#0b4ea2;--bg:#f2f5fa;--pri:#e6007e}
body{background:var(--bg)}
header{background:var(--az);box-shadow:none;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top))}
.logo{width:42px;height:42px;border-radius:12px;background:#fff url(icon-192.png) center/88% no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header h1{font-size:15px;letter-spacing:.03em}header small{color:#b9cdef}
header .btn.gh{border:0;background:rgba(255,255,255,.14);color:#fff;width:38px;height:38px;padding:0;border-radius:10px;font-size:18px}
nav{background:var(--az);border-bottom:0;padding:2px 14px 12px;top:66px;position:sticky}
nav::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,#00aeef 0 25%,#e6007e 25% 50%,#ffd200 50% 75%,#111827 75%)}
nav button{color:var(--azc);border-radius:10px;padding:8px 13px}
nav button:hover{background:rgba(255,255,255,.1);color:#fff}
nav button.on{background:#fff;color:var(--az)}
nav .chs{background:rgba(255,255,255,.12)}nav .chs button{color:#e3ecfa;border-radius:999px}nav .chs button.on{background:var(--pri);color:#fff}
nav .sep{background:rgba(255,255,255,.22)}
nav .mut{color:var(--azc)!important}
nav .ct{background:var(--pri)}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}
main{padding-top:18px}
.card{border:0;border-left:4px solid var(--pri);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1)}
body.em .card{border-left-color:#00aeef}
.card.empty,.card[style*="padding:10px"]{border-left:0}
.kpi{border:0;border-top:3px solid var(--pri);box-shadow:0 1px 3px rgba(16,24,40,.08)}
.kpis .kpi:nth-child(2){border-top-color:#00aeef}.kpis .kpi:nth-child(3){border-top-color:#ffd200}.kpis .kpi:nth-child(4){border-top-color:#111827}
.big{color:var(--az2)}
.btn{border-radius:10px;font-weight:700}
.btn.ok{background:var(--pri);color:#fff}
.btn.mid{background:#eef2f8;color:var(--az2);border:0}
.btn.mid:hover{background:#e2e9f4}
.btn.bad{background:#fff;border:1px solid #fecaca}
input:focus,textarea:focus,select:focus{outline:2px solid #9cc0f0;border-color:var(--az)}
details summary{color:var(--az)}
#toast{background:var(--az2)}
.login{border:0;box-shadow:0 12px 40px rgba(8,59,124,.25)}
body.tela-login{background:linear-gradient(160deg,#0b4ea2 0,#083b7c 60%,#06264f 100%);min-height:100vh}
body.tela-login .login h3{color:var(--az2)}
#bnav{display:none}
@media(max-width:760px){
 header{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
 nav{top:62px;padding:0 10px 10px}
 nav button.tb-main{display:none}
 #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--az);justify-content:space-around;padding:8px 4px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.12)}
 #bnav button{flex:1;border:0;background:transparent;color:var(--azc);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:5px 2px;border-radius:12px;position:relative;margin:0 2px}
 #bnav button.on{color:#fff;background:rgba(255,255,255,.16)}
 #bnav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
 #bnav .ct{position:absolute;top:0;right:calc(50% - 22px);background:var(--pri);color:#fff;border-radius:9px;font-size:10.5px;line-height:17px;min-width:17px;padding:0 4px}
 main{padding-bottom:96px}
 #toast{bottom:92px}
 #chFab{display:none!important}
 #chBox{bottom:84px!important;height:calc(100vh - 160px)!important}
}

<header><div class="logo"></div><h1>PORTO COMUNICAÇÃO<small>Atendimento · propostas · pedidos</small></h1><div class="sp"></div><button class="btn gh" onclick="carregar()">↻</button></header>

<script>
const API='https://portocomunicacao.app.n8n.cloud/webhook/app-porto';let K='',U='';try{K=localStorage.getItem('ppk')||'';U=localStorage.getItem('pu')||''}catch(e){}
const ADM=()=>!U||U=='admin';const NOMES={admin:'Administrador',comercial:'Comercial',financeiro:'Financeiro',producao:'Produção',gestao:'Gestão',planejamento:'Planejamento'};
let D=null,TAB='aprovar',BUSCA='',ALT=null,CH='wa';try{CH=localStorage.getItem('pch')||'wa'}catch(e){}
const EM=()=>CH=='mail';try{TAB=localStorage.getItem('ptab')||'aprovar'}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{if(typeof v==='number')return v;const s=String(v||'').replace(/[^\d,.-]/g,'');return Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)||0};
const dt=t=>t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const tel=f=>{const d=String(f||'').replace(/\D/g,'');return d.length>=12?'('+d.slice(2,4)+') '+d.slice(4,-4)+'-'+d.slice(-4):f};
const nomeDe=c=>c.nome||c.empresa||tel(c.fone||c.mail);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200)}
function login(msg){document.querySelector('header').style.display='none';document.getElementById('nav').style.display='none';document.getElementById('app').innerHTML='<form class="login" onsubmit="entrar(event)"><div class="logo" style="margin:0 auto;width:90px;height:90px;border-radius:22px"></div><h3>Porto Comunicação</h3>'+(msg?'<div style="color:var(--bad)">'+esc(msg)+'</div>':'')+'<select name="u" style="width:100%;padding:12px;border-radius:10px;border:1px solid #d6dae1;font:inherit;background:#fff">'+['comercial','gestao','planejamento','financeiro','producao','admin'].map(u=>'<option value="'+u+'"'+(u==(U||'comercial')?' selected':'')+'>'+NOMES[u]+'</option>').join('')+'</select><input name="s" type="password" placeholder="Senha" autocomplete="current-password" autofocus><button class="btn pri" style="width:100%">Entrar</button></form>'}
async function entrar(e){e.preventDefault();const f=e.target,u=f.u.value,p=f.s.value;if(!p)return;const b=f.querySelector('button');b.disabled=true;try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({a:'login',u,p})});const j=await r.json().catch(()=>({}));if(!j.ok||!j.token){b.disabled=false;return login(j.erro||'Não consegui entrar')}K=j.token;U=j.u;try{localStorage.setItem('ppk',K);localStorage.setItem('pu',U)}catch(x){}if(U==='gestao'||U==='planejamento'){location.replace('gestao.html');return}document.querySelector('header').style.display='';document.getElementById('nav').style.display='';carregar()}catch(x){b.disabled=false;login('Sem conexão. Tente de novo.')}}
async function carregarUsuarios(){const box=document.getElementById('us-list');try{const r=await fetch(API+'?k='+encodeURIComponent(K),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({a:'users'})});const j=await r.json();if(!j.ok)throw new Error(j.erro||r.status);box.className='';box.innerHTML=j.users.map(x=>'<div class="card" style="margin:10px 0 0;box-shadow:none;border:1px solid #e3e6ea"><div class="row"><h3>'+esc(x.nome)+'</h3><span class="tag '+(x.temSenha?'t-pag':'t-est')+'">'+(x.temSenha?'Senha definida':'Sem senha')+'</span><span class="sp"></span><span class="mut">'+(x.temSenha?'usuário: '+esc(x.nome)+(x.atualizado?' · senha de '+dt(x.atualizado):'')+' · '+x.sessoes+' aparelho(s) logado(s)':'ainda não consegue entrar')+'</span></div><form class="row" style="margin-top:8px" onsubmit="salvarSenha(event,\''+x.u+'\')"><input name="p" type="password" autocomplete="new-password" minlength="6" placeholder="'+(x.temSenha?'Nova senha (mín. 6)':'Criar senha (mín. 6)')+'" style="flex:1;min-width:160px"><button class="btn pri">Salvar senha</button>'+(x.temSenha?'<button type="button" class="btn bad" onclick="tirarSenha(\''+x.u+'\',\''+esc(x.nome)+'\')">Bloquear acesso</button>':'')+'</form></div>').join('')}catch(e){box.textContent='Não consegui carregar os usuários ('+e.message+').'}}
async function salvarSenha(e,u){e.preventDefault();const p=e.target.p.value;if(p.length<6){toast('A senha precisa ter pelo menos 6 caracteres');return}await acao({a:'setuser',u,p},'🔑 Senha de '+NOMES[u]+' salva');e.target.p.value='';carregarUsuarios()}
async function tirarSenha(u,n){if(!confirm('Bloquear o acesso de '+n+'? Quem estiver logado sai, e o setor só volta a entrar quando você criar uma senha nova.'))return;await acao({a:'setuser',u,limpar:true},'🔒 Acesso de '+n+' bloqueado');carregarUsuarios()}
function sair(){if(!confirm('Sair do app?'))return;K='';U='';try{localStorage.removeItem('ppk');localStorage.removeItem('pu')}catch(e){}login()}
async function carregar(){if(!K)return login();try{const r=await fetch(API+'?k='+encodeURIComponent(K));if(r.status==401){try{localStorage.removeItem('ppk')}catch(e){}K='';return login(U&&U!='admin'?'Sua sessão expirou ou a senha mudou. Entre de novo.':'Senha incorreta')}D=await r.json();render()}catch(e){document.getElementById('app').innerHTML='<div class="card empty">Não consegui carregar ('+esc(e.message)+'). Toque em ↻.</div>'}}
async function acao(body,okMsg){try{const r=await fetch(API+'?k='+encodeURIComponent(K),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.erro||r.status);toast(okMsg);setTimeout(carregar,5000)}catch(e){toast('Erro: '+e.message)}}
const pdf=pk=>window.open(API+'?a=pdf&pk='+encodeURIComponent(pk)+'&k='+encodeURIComponent(K),'_blank');
function aprovar(pk){if(confirm('Enviar a proposta Nº '+pk+' para o cliente?'))acao({a:EM()?'eok':'ok',pk},'✅ Proposta '+pk+' enviada ao cliente')}
function recusar(pk){if(confirm('Descartar a proposta Nº '+pk+' (não envia ao cliente)?'))acao({a:EM()?'enao':'nao',pk},'Proposta '+pk+' descartada')}
function alterar(pk){ALT=pk;document.getElementById('dlgT').textContent='Alterar proposta Nº '+pk;dlg.querySelector('textarea').value='';dlg.showModal()}
function enviarAlt(e){e.preventDefault();const t=e.target.t.value.trim();dlg.close();acao({a:EM()?'ealterar':'alterar',pk:ALT,texto:t},'✏️ Pedido de alteração enviado. A nova versão aparece em instantes.')}
function iaRetoma(f){if(confirm('A IA vai reassumir '+(EM()?'o atendimento por e-mail de ':'a conversa com ')+tel(f)+' e responder agora. Confirmar?'))acao(EM()?{a:'eia',mail:f}:{a:'ia',fone:f},'🤖 IA reassumiu a conversa')}
function orc(f){if(confirm('Montar agora a proposta de '+tel(f)+' com o que já foi conversado?'))acao(EM()?{a:'eorc',mail:f}:{a:'orc',fone:f},'📄 Montando a proposta… ela aparece em "Aprovar"')}
function pago(pk){if(confirm('Marcar a proposta Nº '+pk+' como PAGA?'))acao({a:EM()?'epago':'pago',pk},'💰 Proposta '+pk+' marcada como paga')}
function os(pk){window.open('https://portocomunicacao.app.n8n.cloud/webhook/os?k='+encodeURIComponent(K)+'&n='+encodeURIComponent(pk),'_blank')}
function novoOrc(e){e.preventDefault();const t=document.getElementById('no-texto').value.trim();if(t.length<5){toast('Descreva o pedido');return}const n=document.getElementById('no-nome').value.trim(),f=document.getElementById('no-fone').value.trim(),em=document.getElementById('no-email').value.trim();if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast('Confira o e-mail do cliente');return}document.getElementById('no-btn').disabled=true;CH='wa';try{localStorage.setItem('pch','wa')}catch(x){}acao({a:'novo',texto:(t+TXTS.map(x=>'\n\n[ARQUIVO ANEXADO: '+x.nome+']\n'+x.texto).join('')).slice(0,30000),nome:n,fone:f,email:em,imgs:IMGS.slice(0,12),imgLeg:IMGS.slice(0,12).map(u=>(window.__LEG||{})[u.length+':'+u.slice(-48)]||''),docs:DOCS.slice(0,3)},'📄 Gerando o orçamento… ele aparece em Aprovar em cerca de 1 minuto');IMGS=[];DOCS=[];TXTS=[];setTimeout(()=>setTab('aprovar'),800);setTimeout(carregar,45000);setTimeout(carregar,75000)}
let PRE=null,NV={},NVi=0,IMGS=[],DOCS=[],TXTS=[],NOMODO='ia',PDFF='';
function modoBar(){return '<div class="card" style="padding:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn '+(NOMODO=='ia'?'pri':'mid')+'" onclick="NOMODO=\'ia\';render()">🤖 Gerar com a IA</button><button class="btn '+(NOMODO=='fora'?'pri':'mid')+'" onclick="NOMODO=\'fora\';render()">📥 Registrar orçamento feito por fora</button><button class="btn '+(NOMODO=='busca'?'pri':'mid')+'" onclick="NOMODO=\'busca\';render()">🔎 Buscar orçamento</button></div>'}
let BQ='';
function todosOrc(){const all=[];for(const [ch,X] of [['wa',D||{}],['mail',(D&&D.mail)||{}]]){for(const p of (X.pend||[]))all.push(Object.assign({},p,{_pend:true,_ch:ch,desc:(p.itens||[]).map(i=>i.q+'× '+i.d).join('; ')}));for(const p of (X.pedidos||[]))all.push(Object.assign({},p,{_ch:ch}))}return all.sort((a,b)=>(Number(b.pk)||0)-(Number(a.pk)||0)||b.t-a.t)}
function stOrc(p){return p._pend?['Aguardando aprovação','t-est']:p.pago?['Paga','t-pag']:p.aprovado?['Aprovada','t-ia']:p.externo?['Feito por fora','t-env']:['Enviada','t-env']}
let LIMO=20;
function cardOrc(p){const s=stOrc(p);const nome=p.nome||p.empresa||(/^manual/.test(String(p.cli))?'Orçamento avulso':tel(p.cli));return '<div class="card"><div class="row"><h3>'+esc(nome)+'</h3><span class="tag '+s[1]+'">'+s[0]+'</span>'+(p.ia?'<span class="tag t-est">🤖 detectado pela IA</span>':'')+'<span class="sp"></span><span class="mut">'+dt(p.t)+'</span></div><div class="mut">Nº '+esc(p.pk)+' · '+(p._ch=='mail'?'✉️ ':'💬 ')+esc(/^manual/.test(String(p.cli))?'sem contato':tel(p.cli))+(p.empresa&&p.empresa!=nome?' · '+esc(p.empresa):'')+'</div><div style="margin-top:8px;font-size:14px">'+esc(String(p.desc||'').slice(0,500))+'</div><div class="mut" style="margin-top:6px">Valor: <b style="color:var(--ink,#111)">'+esc(p.total||'a confirmar')+'</b></div><div class="acts"><button class="btn mid" onclick="pdf(\''+p.pk+'\')">📄 PDF</button><button class="btn mid" onclick="editar(\''+p.pk+'\')">📝 Editar</button>'+(p._pend?'':'<button class="btn mid" onclick="os(\''+p.pk+'\')">🛠️ Ordem de Serviço</button>')+convBtn(p.cli,p.nome)+'<button class="btn mid" onclick="CH=\''+p._ch+'\';setTab(\''+(p._pend?'aprovar':'pedidos')+'\')">Ir para '+(p._pend?'Aprovar':'Pedidos')+'</button>'+nvBtn(nome,p._ch=='mail'?'':p.cli,'Baseado no orçamento Nº '+p.pk+': '+String(p.desc||'')+'\n\nNovo pedido / o que muda: ')+'</div></div>'}
function listaOrc(){const all=todosOrc();if(!all.length)return '';return '<h3 style="margin:18px 4px 8px">Todos os orçamentos ('+all.length+') <span class="mut" style="font-weight:400;font-size:13px">do mais novo para o mais antigo</span></h3>'+all.slice(0,LIMO).map(cardOrc).join('')+(all.length>LIMO?'<div style="text-align:center;margin:10px"><button class="btn mid" onclick="LIMO+=20;render()">Mostrar mais ('+(all.length-LIMO)+')</button></div>':'')}
function buscaOrc(){const q=BQ.trim().toLowerCase();const qn=q.replace(/\D/g,'');const st=stOrc;const all=todosOrc();if(!q)return '';const r=all.filter(p=>(qn&&String(p.pk)===qn)||(q.length>=3&&((p.nome||'')+' '+(p.empresa||'')+' '+(p.cli||'')+' '+(p.desc||'')).toLowerCase().includes(q))).sort((a,b)=>(String(b.pk)===qn)-(String(a.pk)===qn)||b.t-a.t).slice(0,30);if(!r.length)return '<div class="card empty">Nenhum orçamento encontrado para “'+esc(BQ)+'”.</div>';return r.map(cardOrc).join('')}
function pdfFora(inp){const f=(inp.files||[])[0];inp.value='';if(!f)return;if(f.size>2000000){toast('PDF maior que 2 MB');return}const fr=new FileReader();fr.onload=()=>{PDFF=fr.result;const s=document.getElementById('rf-pdf');if(s)s.textContent='✔ '+f.name};fr.readAsDataURL(f)}

function jpg(file){return new Promise((ok,er)=>{const fr=new FileReader();fr.onerror=er;fr.onload=()=>{const im=new Image();im.onerror=er;im.onload=()=>{let w=im.width,h=im.height,M=1400;if(w>M||h>M){const s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let q=.8,u=c.toDataURL('image/jpeg',q);while(u.length>520000&&q>.35){q-=.1;u=c.toDataURL('image/jpeg',q)}ok(u)};im.src=fr.result};fr.readAsDataURL(file)})}

function finalJpeg(cv){let c=cv;const mn=Math.min(c.width,c.height);
  if(mn>0&&mn<700){const f=Math.min(2.2,1100/mn);const u=document.createElement('canvas');u.width=Math.round(c.width*f);u.height=Math.round(c.height*f);const g=u.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(c,0,0,u.width,u.height);
    try{const id=g.getImageData(0,0,u.width,u.height);const s=id.data,o=new Uint8ClampedArray(s),W=u.width,Hh=u.height,k=0.55;

async function paraJpeg(blob){

    const w=im.naturalWidth||1200,h=im.naturalHeight||900,s=Math.min(1,2000/Math.max(w,h));

}
async function pdfjs(){const p=await lib(CDN+'pdf.js/3.11.174/pdf.min.js','pdfjsLib');p.GlobalWorkerOptions.workerSrc=CDN+'pdf.js/3.11.174/pdf.worker.min.js';return p}
async function abrirPdf(buf){
  const p=await pdfjs();const d=await p.getDocument({data:new Uint8Array(buf)}).promise;
  let tx='';for(let i=1;i<=Math.min(d.numPages,40);i++){const c=await(await d.getPage(i)).getTextContent();tx+=c.items.map(x=>x.str).join(' ')+'\n'}

}
async function renderPags(d,n){const out=[];for(let i=1;i<=Math.min(d.numPages,n);i++){const pg=await d.getPage(i);const v=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(3,2000/Math.max(v.width,v.height))});

    await pg.render({canvasContext:g,viewport:vp}).promise;out.push(cv.toDataURL('image/jpeg',0.78))}return out}
function objParaJpeg(o){if(!o)return null;const w=o.width,h=o.height;if(!w||!h||w<200||h<150||w*h<40000)return null;const s=Math.min(1,2000/Math.max(w,h));const cv=document.createElement('canvas');cv.width=Math.round(w*s);cv.height=Math.round(h*s);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
  if(o.bitmap){g.drawImage(o.bitmap,0,0,cv.width,cv.height)}else if(o.data){const t=document.createElement('canvas');t.width=w;t.height=h;const id=t.getContext('2d').createImageData(w,h);const D=id.data,S=o.data;
    if(o.kind===3){for(let q=0;q<D.length;q++)D[q]=S[q]}else if(o.kind===2){for(let a=0,b=0;b<D.length;a+=3,b+=4){D[b]=S[a];D[b+1]=S[a+1];D[b+2]=S[a+2];D[b+3]=255}}else if(o.kind===1){const rb=(w+7)>>3;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const bit=(S[y*rb+(x>>3)]>>(7-(x&7)))&1;const b=(y*w+x)*4;const v=bit?255:0;D[b]=D[b+1]=D[b+2]=v;D[b+3]=255}}else return null;
    t.getContext('2d').putImageData(id,0,0);g.drawImage(t,0,0,cv.width,cv.height)}else return null;
  try{const px=g.getImageData(0,0,cv.width,cv.height).data;let mn=255,mx=0;for(let q=0;q<px.length;q+=4*97){const v=px[q]*.3+px[q+1]*.59+px[q+2]*.11;if(v<mn)mn=v;if(v>mx)mx=v}if(mx-mn<25)return null}catch(e){}

async function imgsEmbutidas(d,nome){const p=window.pdfjsLib;const out=[];const vistos=new Set();
  for(let i=1;i<=Math.min(d.numPages,20)&&out.length<6;i++){let pg,ops;try{pg=await d.getPage(i);ops=await pg.getOperatorList()}catch(e){continue}
    for(let k=0;k<ops.fnArray.length&&out.length<6;k++){const fn=ops.fnArray[k];if(fn!==p.OPS.paintImageXObject&&fn!==p.OPS.paintJpegXObject)continue;const id=ops.argsArray[k][0];if(typeof id!=='string'||vistos.has(id))continue;vistos.add(id);
      const obj=await new Promise(ok=>{let done=false;const fim=v=>{if(!done){done=true;ok(v)}};try{const src=id.startsWith('g_')?pg.commonObjs:pg.objs;if(src.has&&src.has(id))fim(src.get(id));else src.get(id,fim)}catch(e){fim(null)}setTimeout(()=>fim(null),4000)});
      let u=null;try{u=objParaJpeg(obj)}catch(e){}if(u)out.push({u,leg:'Imagem tirada do PDF "'+nome+'" (pág. '+i+')'})}}
  return out}
async function zipTexto(buf,filtro,ordem){
  const Z=await lib(CDN+'jszip/3.10.1/jszip.min.js','JSZip');const z=await Z.loadAsync(buf);
  let nomes=Object.keys(z.files).filter(n=>filtro.test(n));if(ordem)nomes.sort((a,b)=>(parseInt(a.replace(/\D+/g,''))||0)-(parseInt(b.replace(/\D+/g,''))||0));
  let t='';for(const n of nomes){const x=await z.file(n).async('string');t+=x.replace(/<\/(a:p|text:p|w:p|text:h)>/g,'\n').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/[ \t]+/g,' ')+'\n'}
  return t.trim();
}
function textoBruto(buf){ // extrai trechos legíveis de arquivos binários (.doc, .cdr, .msg...)
  const u=new Uint8Array(buf);let out=[],cur='';
  for(let i=0;i<u.length&&out.length<4000;i++){const c=u[i];if((c>=32&&c<127)||c>=192||c===10){cur+=String.fromCharCode(c)}else{if(cur.trim().length>=5)out.push(cur.trim());cur=''}}if(cur.trim().length>=5)out.push(cur.trim());

const pdfMagic=async f=>{try{const b=new Uint8Array(await f.slice(0,5).arrayBuffer());return String.fromCharCode(...b)==='%PDF-'}catch(e){return false}};

window.addImgs=async function(inp){
  const fs=[...(inp.files||[])];if(inp)try{inp.value=''}catch(e){}
  if(!fs.length)return;
    const tot=()=>IMGS.length+DOCS.length+TXTS.length;
  aviso('⏳ Lendo '+fs.length+' arquivo(s)...');
  const falhas=[];
  for(const f of fs){
    if(DOCS.length+TXTS.length>=14){aviso('Limite de anexos atingido.');break}
    const e=ext(f);
    try{
      if(f.size>60e6){falhas.push(f.name+' (maior que 60 MB)');continue}
      // PDF (e .ai/.eps salvos com PDF dentro)
      if(f.type.includes('pdf')||e==='pdf'||((e==='ai'||e==='eps'||!f.type)&&await pdfMagic(f))){

        else if(info){try{(await renderPags(info.d,MAXPAGS)).forEach((u,i)=>pushImg(u,'Página '+(i+1)+' do PDF "'+f.name+'" (página inteira do documento)'))}catch(x){}

        let blob=f;
        if(/^(heic|heif)$/.test(e)||/hei[cf]/.test(f.type)){const H=await lib('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js','heic2any');blob=await H({blob:f,toType:'image/jpeg',quality:0.85});if(Array.isArray(blob))blob=blob[0]}
        if(/^tiff?$/.test(e)){const U=await lib('https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js','UTIF');const b=await ler(f,'buf');const ifd=U.decode(b);U.decodeImage(b,ifd[0]);const rgba=U.toRGBA8(ifd[0]);const cv=document.createElement('canvas');cv.width=ifd[0].width;cv.height=ifd[0].height;cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba),cv.width,cv.height),0,0);blob=await new Promise(ok=>cv.toBlob(ok,'image/png'))}

      }

        const X=await lib(CDN+'xlsx/0.18.5/xlsx.full.min.js','XLSX');const wb=X.read(await ler(f,'buf'),{type:'array'});
        TXTS.push({nome:f.name,texto:wb.SheetNames.map(n=>'Planilha '+n+':\n'+X.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n').slice(0,20000)});continue;
      }
      if(e==='docx'||e==='docm'||e==='dotx'){const M=await lib(CDN+'mammoth/1.6.0/mammoth.browser.min.js','mammoth');const r=await M.extractRawText({arrayBuffer:await ler(f,'buf')});TXTS.push({nome:f.name,texto:r.value.slice(0,20000)});continue}

        try{const Z=await lib(CDN+'jszip/3.10.1/jszip.min.js','JSZip');const z=await Z.loadAsync(buf);const ms=Object.keys(z.files).filter(n=>/^ppt\/media\/.+\.(png|jpe?g|gif|bmp|webp)$/i.test(n)).map(n=>({n,sz:z.files[n]._data&&z.files[n]._data.uncompressedSize||0})).sort((a,b)=>b.sz-a.sz).slice(0,6);
          for(const m of ms){try{const bl=await z.file(m.n).async('blob');pushImg(await paraJpeg(bl),'Imagem do PowerPoint "'+f.name+'"')}catch(x){}}}catch(x){console.warn('pptx imgs',x)}

    }catch(x){console.error('anexo',f.name,x);falhas.push(f.name)}

const libera=()=>document.querySelectorAll('input[type=file][onchange*="addImgs"]').forEach(i=>{if(i.accept)i.removeAttribute('accept');i.multiple=true});

})();

const C="<svg class=\"mcena\" viewBox=\"0 0 256 256\"><g class=\"cLap\"><ellipse class=\"cLuz\" cx=\"160\" cy=\"122\" rx=\"46\" ry=\"22\" fill=\"#bff0ff\"/><rect x=\"0\" y=\"204\" width=\"256\" height=\"16\" rx=\"6\" fill=\"#b07a4a\"/><rect x=\"0\" y=\"216\" width=\"256\" height=\"40\" fill=\"#8a5a33\"/><rect x=\"28\" y=\"198\" width=\"190\" height=\"9\" rx=\"4\" fill=\"#7d8792\" stroke=\"#4f5862\" stroke-width=\"2\"/><path d=\"M48 200 L60 158 Q62 152 68 152 L188 152 Q194 152 194 158 L204 200 Z\" fill=\"#c9d0d8\" stroke=\"#5d6670\" stroke-width=\"3\" stroke-linejoin=\"round\"/><circle cx=\"126\" cy=\"177\" r=\"9\" fill=\"#e6007e\"/><circle cx=\"126\" cy=\"177\" r=\"4\" fill=\"#fff\"/><g class=\"cTec\"><text x=\"4\" y=\"124\" font-family=\"Comic Sans MS,cursive\" font-weight=\"800\" font-size=\"15\" fill=\"#0b4ea2\">tec</text><text x=\"222\" y=\"104\" font-family=\"Comic Sans MS,cursive\" font-weight=\"800\" font-size=\"15\" fill=\"#e6007e\">tec</text></g><g class=\"cCod\"><rect x=\"200\" y=\"160\" width=\"34\" height=\"6\" rx=\"3\" fill=\"#00aeef\"/><rect x=\"206\" y=\"172\" width=\"24\" height=\"6\" rx=\"3\" fill=\"#e6007e\"/><rect x=\"200\" y=\"184\" width=\"30\" height=\"6\" rx=\"3\" fill=\"#ffd200\"/></g></g><g class=\"cAno\"><g transform=\"rotate(-10 205 175)\"><rect x=\"168\" y=\"120\" width=\"72\" height=\"96\" rx=\"6\" fill=\"#fff\" stroke=\"#3b3b3f\" stroke-width=\"3\"/><rect x=\"190\" y=\"112\" width=\"28\" height=\"12\" rx=\"3\" fill=\"#3b3b3f\"/><path class=\"cL1\" d=\"M178 142 H230\" stroke=\"#0b4ea2\" stroke-width=\"4\" stroke-linecap=\"round\"/><path class=\"cL2\" d=\"M178 158 H222\" stroke=\"#0b4ea2\" stroke-width=\"4\" stroke-linecap=\"round\"/><path class=\"cL3\" d=\"M178 174 H228\" stroke=\"#0b4ea2\" stroke-width=\"4\" stroke-linecap=\"round\"/><path class=\"cL4\" d=\"M178 190 H214\" stroke=\"#e6007e\" stroke-width=\"4\" stroke-linecap=\"round\"/></g><g class=\"cLapis\"><path d=\"M0 0 L8 -34 L18 -32 L10 2 Z\" fill=\"#ffd200\" stroke=\"#7a5b00\" stroke-width=\"2\"/><path d=\"M0 0 L10 2 L3 10 Z\" fill=\"#f3c9a0\"/><circle cx=\"13\" cy=\"-30\" r=\"10\" fill=\"url(#mgY)\"/></g></g></svg>";
let n=0,balOn=false;
function poe(){document.querySelectorAll('.masc').forEach(m=>{if(!m.querySelector('.mcena'))m.insertAdjacentHTML('beforeend',C)})}
function cena(m,c){if(!m)return;m.classList.remove('digita','anota');if(c)m.classList.add(c)}
setInterval(()=>{try{poe();
 const b=document.getElementById('chBal'),on=!!(b&&b.classList.contains('on'));
 const f=document.querySelector('#chFab .masc');
 if(on)cena(f,'');else if(balOn||(f&&!f.classList.contains('digita')&&!f.classList.contains('anota')&&n===0)){cena(f,(n++%2)?'anota':'digita')}
 balOn=on;
 const av=document.querySelector('#chHd .masc');if(av)cena(av,av.classList.contains('pensa')?'digita':'');
 const w=document.querySelector('#chMs .chMasc .masc');if(w&&!w.classList.contains('acena')){const s=Math.floor(Date.now()/6000)%3;cena(w,['','digita','anota'][s])}
}catch(e){}},500);
})();
</script>

<script>
/* ===== Tabela de preços (banco de dados editável) ===== */
(function(){
let TAB=null,ORIG='',HIST=0;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{v=String(v==null?'':v).trim();if(/,/.test(v))v=v.replace(/\./g,'').replace(',','.');return Number(v)||0};
const fmt=v=>v?String(v).replace('.',','):'';
function dlg(){let d=document.getElementById('dlgPr');if(d)return d;d=document.createElement('div');d.id='dlgPr';
 d.innerHTML='<div class="pw"><div class="ph"><h3>📋 Tabela de preços<small id="prInfo">carregando…</small></h3><button onclick="fecharPrecos()" aria-label="Fechar">✕</button></div><div class="pb">'
 +'<div class="sim"><b>🧮 Simular:</b><select id="prSp"></select><input id="prSl" placeholder="Larg. (m)" inputmode="decimal"><input id="prSa" placeholder="Alt. (m)" inputmode="decimal"><input id="prSq" placeholder="Qtd" value="1" inputmode="numeric"><div class="res" id="prSr">Escolha um produto para ver o valor que vai no orçamento.</div></div>'
 +'<div class="tb"><input id="prBu" placeholder="🔎 Buscar produto ou código…"><button class="bt" onclick="prNovo()">＋ Produto</button><button class="bt" id="prDz" onclick="prDesfazer()">↶ Desfazer última</button><button class="bt pri" id="prSv" onclick="prSalvar()">Salvar tabela</button></div>'
 +'<table><thead><tr><th style="width:150px">Código</th><th>Produto (como a IA lê)</th><th style="width:86px">Cobrança</th><th style="width:110px">Preço (R$)</th><th style="width:110px">Mínimo/peça</th><th style="width:22%">Regra para a IA</th><th style="width:46px">Ativo</th><th style="width:34px"></th></tr></thead><tbody id="prTb"></tbody></table>'
 +'<p class="nota">A IA só escolhe o <b>código</b> e as medidas; o sistema calcula o valor com esta tabela. Peças com menos de 1 m² são cobradas como 1 m². O "mínimo/peça" é o valor mínimo de cada peça (ex.: letreiro LED). Mudanças valem para os próximos orçamentos.</p></div></div>';
 document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)fecharPrecos()});
 d.querySelector('#prBu').oninput=filtra;['prSp','prSl','prSa','prSq'].forEach(i=>d.querySelector('#'+i).oninput=simula);
 d.querySelector('#prTb').addEventListener('input',e=>{const tr=e.target.closest('tr');if(tr){ler();tr.classList.toggle('off',!tr.querySelector('[data-k=ativo]').checked);marca();opcoes();simula()}});
 return d}
function linha(e,i){return '<tr data-i="'+i+'" class="'+(e.ativo===false?'off':'')+'">'
 +'<td class="c-id" data-l="Código"><input data-k="id" value="'+esc(e.id)+'"></td>'
 +'<td class="c-nm" data-l="Produto"><input data-k="nome" value="'+esc(e.nome)+'"></td>'
 +'<td data-l="Cobrança"><select data-k="un"><option value="m2"'+(e.un==='m2'?' selected':'')+'>por m²</option><option value="un"'+(e.un!=='m2'?' selected':'')+'>por unid.</option></select></td>'
 +'<td class="c-pr" data-l="Preço (R$)"><input data-k="preco" inputmode="decimal" value="'+esc(fmt(e.preco))+'"></td>'
 +'<td class="c-mn" data-l="Mínimo/peça"><input data-k="min" inputmode="decimal" placeholder="—" value="'+esc(fmt(e.min))+'"></td>'
 +'<td class="c-ob" data-l="Regra para a IA"><textarea data-k="obs" placeholder="opcional">'+esc(e.obs||'')+'</textarea></td>'
 +'<td data-l="Ativo"><input type="checkbox" data-k="ativo"'+(e.ativo===false?'':' checked')+' style="width:20px;height:20px;margin-top:6px"></td>'
 +'<td><button class="x" title="Remover" onclick="prDel('+i+')">🗑</button></td></tr>'}
function desenha(){const tb=document.getElementById('prTb');tb.innerHTML=TAB.itens.map(linha).join('');filtra();opcoes();marca()}
function ler(){document.querySelectorAll('#prTb tr').forEach(tr=>{const e=TAB.itens[+tr.dataset.i];if(!e)return;tr.querySelectorAll('[data-k]').forEach(f=>{const k=f.dataset.k;if(k==='ativo')e.ativo=f.checked?undefined:false;else if(k==='preco'||k==='min')e[k]=num(f.value);else e[k]=k==='id'?f.value.toUpperCase().trim():f.value})})}
function marca(){const mud=JSON.stringify(TAB.itens)!==ORIG;const b=document.getElementById('prSv');b.disabled=!mud;b.textContent=mud?'Salvar alterações':'Salvo ✓';document.getElementById('prDz').disabled=!HIST}
function filtra(){const q=(document.getElementById('prBu').value||'').toLowerCase();document.querySelectorAll('#prTb tr').forEach(tr=>{const e=TAB.itens[+tr.dataset.i]||{};tr.style.display=!q||(e.id+' '+e.nome).toLowerCase().includes(q)?'':'none'})}
function opcoes(){const s=document.getElementById('prSp'),v=s.value;s.innerHTML='<option value="">— produto —</option>'+TAB.itens.filter(e=>e.id&&e.ativo!==false).map(e=>'<option value="'+esc(e.id)+'">'+esc(e.id+' · '+e.nome)+'</option>').join('');s.value=v}
function simula(){const r=document.getElementById('prSr');const e=TAB.itens.find(x=>x.id===document.getElementById('prSp').value);if(!e){r.innerHTML='Escolha um produto para ver o valor que vai no orçamento.';return}
 const q=Math.max(1,Math.round(num(document.getElementById('prSq').value)||1));let p=num(e.preco),mn=num(e.min);
 if(e.un==='m2'){let L=num(document.getElementById('prSl').value),A=num(document.getElementById('prSa').value);if(!(L>0&&A>0)){r.innerHTML='Informe largura e altura em metros.';return}
  if(Math.max(L,A)>30){if(L>3)L/=100;if(A>3)A/=100}const ar=L*A,cob=Math.max(ar,1);if(mn>0&&p*cob<mn)p=Math.ceil(mn/cob*100)/100;const pc=Math.round(cob*p*100)/100;
  r.innerHTML=fmt(L)+' × '+fmt(A)+' m = '+ar.toFixed(2).replace('.',',')+' m²'+(ar<1?' (cobra 1 m²)':'')+' × '+brl(p)+'/m²'+(p!==num(e.preco)?' <i>(ajustado ao mínimo de '+brl(mn)+')</i>':'')+' = '+brl(pc)+' por peça'+(q>1?' × '+q:'')+' → <strong>'+brl(pc*q)+'</strong>'}
 else{if(mn>0&&p<mn)p=mn;r.innerHTML=q+' × '+brl(p)+' → <strong>'+brl(p*q)+'</strong>'}}
async function carregar(modo,extra){const r=await edApi(Object.assign({a:'precos',modo:modo||'ler'},extra||{}));TAB={itens:r.tab.itens.map(e=>({id:e.id,nome:e.nome,un:e.un==='m2'?'m2':'un',preco:Number(e.preco)||0,min:Number(e.min)||0,obs:e.obs||'',ativo:e.ativo===false?false:undefined,inst:e.inst||undefined}))};HIST=r.hist||0;ORIG=JSON.stringify(TAB.itens);
 document.getElementById('prInfo').textContent=TAB.itens.length+' produtos · '+(r.tab.v?'versão '+r.tab.v+(r.tab.t?' · alterada em '+new Date(r.tab.t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'')+(r.tab.u?' por '+r.tab.u:''):'tabela original');desenha();simula()}
window.abrirPrecos=async function(){const d=dlg();d.classList.add('on');document.body.style.overflow='hidden';try{await carregar()}catch(e){document.getElementById('prInfo').textContent='Erro: '+e.message}};
window.fecharPrecos=function(){if(TAB&&JSON.stringify(TAB.itens)!==ORIG&&!confirm('Sair sem salvar as alterações?'))return;document.getElementById('dlgPr').classList.remove('on');document.body.style.overflow=''};
window.prNovo=function(){ler();TAB.itens.unshift({id:'',nome:'',un:'m2',preco:0});document.getElementById('prBu').value='';desenha();const i=document.querySelector('#prTb tr [data-k=id]');if(i)i.focus()};
window.prDel=function(i){ler();const e=TAB.itens[i];if(!confirm('Remover "'+(e.nome||e.id||'linha')+'" da tabela?'))return;TAB.itens.splice(i,1);desenha()};
window.prSalvar=async function(){ler();const ruins=TAB.itens.filter(e=>(e.id||e.nome)&&(!e.id||!e.nome||!(num(e.preco)>0)));if(ruins.length){alert('Preencha código, produto e preço de: '+ruins.map(e=>e.id||e.nome).join(', '));return}
 const ids=TAB.itens.map(e=>e.id).filter(Boolean);const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);if(dup.length){alert('Código repetido: '+[...new Set(dup)].join(', '));return}
 const b=document.getElementById('prSv');b.disabled=true;b.textContent='Salvando…';try{await carregar('salvar',{itens:TAB.itens.filter(e=>e.id&&e.nome)});toast&&toast('Tabela de preços salva')}catch(e){alert('Não salvou: '+e.message);marca()}};
window.prDesfazer=async function(){if(!confirm('Voltar a tabela para a versão anterior?'))return;try{await carregar('desfazer');toast&&toast('Tabela voltou para a versão anterior')}catch(e){alert(e.message)}};
// botão no menu de cima e no menu lateral
const IC='<svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>';
function botoes(){const nav=document.getElementById('nav');if(nav&&nav.children.length&&!nav.querySelector('.btPr')){const seps=nav.querySelectorAll(':scope > .sep');const b=document.createElement('button');b.className='btPr';b.textContent='🏷️ Preços';b.onclick=()=>abrirPrecos();if(seps.length>1)nav.insertBefore(b,seps[seps.length-1]);else nav.appendChild(b)}
 const rl=document.getElementById('rail');if(rl&&rl.children.length&&!rl.querySelector('.rbPr')){const s=rl.querySelectorAll('.sepr');const b=document.createElement('button');b.className='rb rbPr';b.setAttribute('aria-label','Tabela de preços');b.innerHTML=IC+'<span class="lb">Tabela de preços</span>';b.onclick=()=>abrirPrecos();if(s.length>1)rl.insertBefore(b,s[1]);else rl.appendChild(b)}}
const r2=window.render;if(typeof r2==='function'){window.render=function(){const x=r2.apply(this,arguments);try{botoes()}catch(e){}return x}}
setInterval(()=>{try{if(!document.querySelector('.login'))botoes()}catch(e){}},1500);
})();
</script>
<script>
/* ===== Busca de orçamentos também no arquivo (todos os já feitos) ===== */
(function(){
if(typeof buscaOrc!=='function')return;
const b0=buscaOrc;let ULTQ='',RES=[],T=null;
function extra(){if(RES===null)return '<div class="mut" style="margin:10px 2px">🔎 Procurando nos orçamentos antigos…</div>';
 const loc=new Set(todosOrc().map(p=>String(p.pk)));const x=(RES||[]).filter(p=>!loc.has(String(p.pk)));if(!x.length)return '';
 return '<div class="mut" style="margin:16px 2px 8px;font-weight:700">📦 Orçamentos antigos ('+x.length+')</div>'+x.map(p=>{try{return cardOrc(p)}catch(e){return '<div class="card">Nº '+esc(p.pk)+' · '+esc(p.nome||p.cli)+' · '+esc(p.total||'')+'</div>'}}).join('')}
function ajusta(){const el=document.getElementById('bArq');if(!el)return;el.innerHTML=extra();const vazio=el.parentElement&&el.parentElement.querySelector(':scope > .card.empty');if(vazio)vazio.style.display=el.querySelector('.card')?'none':''}
window.buscaOrc=function(){const h=b0();const q=String(typeof BQ!=='undefined'?BQ:'').trim();if(!q)return h;
 if(q!==ULTQ){ULTQ=q;RES=null;clearTimeout(T);T=setTimeout(async()=>{let r=[];try{r=(await edApi({a:'buscaorc',q})).r||[]}catch(e){}if(q!==ULTQ)return;RES=r;ajusta()},400)}
 setTimeout(ajusta,0);return h+'<div id="bArq">'+extra()+'</div>'};
})();
</script>

<script>
/* ===== Editar imagem da proposta com IA ===== */
(function(){
let PK='',ORC=null,NOME='',FONE='',RES='',ANEXO='';
function dlg(){let d=document.getElementById('dlgImg');if(d)return d;d=document.createElement('div');d.id='dlgImg';
 d.innerHTML='<div class="iw" role="dialog" aria-modal="true" aria-label="Editar imagem com IA"><div class="ih"><h3 id="imgTit">🎨 Editar imagem com IA</h3><button id="imgX" aria-label="Fechar">✕</button></div><div class="ib">'
