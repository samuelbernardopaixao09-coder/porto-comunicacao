name: Publicar app Porto
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Trazer o app (so na primeira vez)
        run: |
          set -e
          if [ ! -f index.html ]; then
            for f in index.html sw.js manifest.json icon-192.png icon-512.png; do
              curl -fsSL -o "$f" "https://porto-comunicacao-app.netlify.app/$f"
            done
            python3 - <<'EOF'
          import json, re
          s = open('index.html', encoding='utf-8').read()
          s = re.sub(r'<script[^>]*/\.netlify/[^>]*></script>\s*', '', s)
          open('index.html', 'w', encoding='utf-8').write(s)
          m = json.load(open('manifest.json', encoding='utf-8'))
          for k in ('id', 'start_url', 'scope'):
              m[k] = './'
          for i in m.get('icons', []):
              i['src'] = i['src'].lstrip('/')
          json.dump(m, open('manifest.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sw.js manifest.json icon-192.png icon-512.png
            git commit -m "App Porto"
            git push
          fi
          mkdir site
          cp index.html sw.js manifest.json icon-192.png icon-512.png site/
          if [ -f logo.svg ]; then
            sudo apt-get install -y -qq librsvg2-bin >/dev/null
            rsvg-convert -w 512 -h 512 logo.svg -o site/icon-512.png
            rsvg-convert -w 192 -h 192 logo.svg -o site/icon-192.png
          fi
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
