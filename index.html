<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=7af91181-430d-4064-920a-f4c83a396c64
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. --><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json" crossorigin="use-credentials"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Porto">
<title>Porto Comunicação</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--pri:#e6007e;--cy:#00aeef;--ye:#ffd200;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--top:#111827}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--top);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{width:40px;height:40px;border-radius:12px;background:url(icon-192.png) center/cover;flex:none}
header h1{font-size:16px;margin:0}header small{display:block;color:#9ca3af;font-size:12px;font-weight:400}.sp{flex:1}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}.btn.pri{background:var(--pri);color:#fff}.btn.gh{background:transparent;color:inherit;border:1px solid #374151}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:#fff;color:var(--bad);border:1px solid #fecaca}.btn.mid{background:#fff;color:var(--ink);border:1px solid var(--line)}
nav{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:4;overflow-x:auto}
nav button{border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;font-size:14px}nav button.on{background:var(--top);color:#fff}
nav .ct{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--pri);color:#fff;font-size:11px;line-height:18px}
main{max-width:1000px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}
.card h3{margin:0 0 4px;font-size:16px}.mut{color:var(--mut);font-size:13px}.big{font-size:22px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.it{font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}.it:last-child{border:0}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}.t-ia{background:#e0f2fe;color:#075985}.t-hum{background:#fef3c7;color:#92400e}.t-pag{background:#dcfce7;color:#166534}.t-env{background:#ede9fe;color:#5b21b6}.t-est{background:#fee2e2;color:#991b1b}
.msg{font-size:13px;padding:6px 10px;border-radius:10px;margin:4px 0;max-width:92%;white-space:pre-wrap;word-break:break-word}.msg.c{background:#f3f4f6}.msg.a{background:#fdf2f8;margin-left:auto}
details summary{cursor:pointer;color:var(--cy);font-size:13px;margin-top:8px}
input,textarea,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase}.kpi .v{font-size:20px;font-weight:700;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:24px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--top);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90vw}
dialog{border:0;border-radius:16px;padding:0;width:min(460px,94vw)}dialog::backdrop{background:rgba(0,0,0,.5)}.dl{padding:18px}
.login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}.login input{margin:12px 0}
.svg text{font-size:10px;fill:#6b7280}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}header small{display:none}.kpi .v{font-size:17px}nav{top:60px}}
</style></head><body>
<header><div class="logo"></div><h1>PORTO COMUNICAÇÃO<small>Atendimento · propostas · pedidos</small></h1><div class="sp"></div><button class="btn gh" onclick="carregar()">↻</button></header>
<nav id="nav"></nav>
<main id="app"><div class="empty">Carregando…</div></main>
<dialog id="dlg"><form class="dl" onsubmit="enviarAlt(event)"><h3 id="dlgT">Pedir alteração</h3><p class="mut">Escreva o que mudar (ex.: valor 250, quantidade 3, tirar a instalação).</p><textarea name="t" rows="3" required></textarea><div class="acts" style="justify-content:flex-end"><button type="button" class="btn mid" onclick="dlg.close()">Cancelar</button><button class="btn pri">Enviar</button></div></form></dialog>
<div id="toast"></div>
<script>
const API='https://portocomunicacao.app.n8n.cloud/webhook/app-porto';let K='';try{K=localStorage.getItem('ppk')||''}catch(e){}
let D=null,TAB='aprovar',BUSCA='',ALT=null;try{TAB=localStorage.getItem('ptab')||'aprovar'}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{if(typeof v==='number')return v;const s=String(v||'').replace(/[^\d,.-]/g,'');return Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)||0};
const dt=t=>t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const tel=f=>{const d=String(f||'').replace(/\D/g,'');return d.length>=12?'('+d.slice(2,4)+') '+d.slice(4,-4)+'-'+d.slice(-4):f};
const nomeDe=c=>c.nome||c.empresa||tel(c.fone);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200)}
function login(msg){document.querySelector('header').style.display='none';document.getElementById('nav').style.display='none';document.getElementById('app').innerHTML='<form class="login" onsubmit="event.preventDefault();K=this.s.value.trim();try{localStorage.setItem(\'ppk\',K)}catch(e){};document.querySelector(\'header\').style.display=\'\';document.getElementById(\'nav\').style.display=\'\';carregar()"><div class="logo" style="margin:0 auto;width:90px;height:90px;border-radius:22px"></div><h3>Porto Comunicação</h3>'+(msg?'<div style="color:var(--bad)">'+msg+'</div>':'')+'<input name="s" type="password" placeholder="Senha" autofocus><button class="btn pri" style="width:100%">Entrar</button></form>'}
async function carregar(){if(!K)return login();try{const r=await fetch(API+'?k='+encodeURIComponent(K));if(r.status==401){try{localStorage.removeItem('ppk')}catch(e){}return login('Senha incorreta')}D=await r.json();render()}catch(e){document.getElementById('app').innerHTML='<div class="card empty">Não consegui carregar ('+esc(e.message)+'). Toque em ↻.</div>'}}
async function acao(body,okMsg){try{const r=await fetch(API+'?k='+encodeURIComponent(K),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.erro||r.status);toast(okMsg);setTimeout(carregar,5000)}catch(e){toast('Erro: '+e.message)}}
const pdf=pk=>window.open(API+'?a=pdf&pk='+encodeURIComponent(pk)+'&k='+encodeURIComponent(K),'_blank');
function aprovar(pk){if(confirm('Enviar a proposta Nº '+pk+' para o cliente?'))acao({a:'ok',pk},'✅ Proposta '+pk+' enviada ao cliente')}
function recusar(pk){if(confirm('Descartar a proposta Nº '+pk+' (não envia ao cliente)?'))acao({a:'nao',pk},'Proposta '+pk+' descartada')}
function alterar(pk){ALT=pk;document.getElementById('dlgT').textContent='Alterar proposta Nº '+pk;dlg.querySelector('textarea').value='';dlg.showModal()}
function enviarAlt(e){e.preventDefault();const t=e.target.t.value.trim();dlg.close();acao({a:'alterar',pk:ALT,texto:t},'✏️ Pedido de alteração enviado. A nova versão aparece em instantes.')}
function iaRetoma(f){if(confirm('A IA vai reassumir a conversa com '+tel(f)+' e responder agora. Confirmar?'))acao({a:'ia',fone:f},'🤖 IA reassumiu a conversa')}
function orc(f){if(confirm('Montar agora a proposta de '+tel(f)+' com o que já foi conversado?'))acao({a:'orc',fone:f},'📄 Montando a proposta… ela aparece em "Aprovar"')}
function pago(pk){if(confirm('Marcar a proposta Nº '+pk+' como PAGA?'))acao({a:'pago',pk},'💰 Proposta '+pk+' marcada como paga')}
function os(pk){window.open('https://portocomunicacao.app.n8n.cloud/webhook/os?k='+encodeURIComponent(K)+'&n='+encodeURIComponent(pk),'_blank')}
function setTab(t){TAB=t;try{localStorage.setItem('ptab',t)}catch(e){}render();scrollTo(0,0)}
function render(){if(!D)return;document.querySelector('header').style.display='';document.getElementById('nav').style.display='';const pend=D.pend||[],cli=D.clientes||[],ped=D.pedidos||[];const hum=cli.filter(c=>c.estado=='humano');
document.getElementById('nav').innerHTML=[['aprovar','Aprovar',pend.length],['atend','Atendimentos',hum.length],['pedidos','Pedidos',0],['vendas','Vendas',0]].map(t=>'<button class="'+(TAB==t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+(t[2]?'<span class="ct">'+t[2]+'</span>':'')+'</button>').join('');
const A=document.getElementById('app');
if(TAB=='aprovar'){A.innerHTML=pend.length?pend.map(p=>'<div class="card"><div class="row"><h3>Proposta Nº '+esc(p.pk)+'</h3>'+(p.estimativa?'<span class="tag t-est">ESTIMATIVA</span>':'')+'<span class="sp"></span><span class="big">'+esc(p.total)+'</span></div><div class="mut">'+(p.nome?esc(p.nome)+' · ':'')+tel(p.cli)+' · '+dt(p.t)+'</div><div style="margin-top:8px">'+(p.itens||[]).map(i=>'<div class="it">'+esc(i.q)+'× '+esc(i.d)+(i.m?' <span class="mut">('+esc(i.m)+')</span>':'')+'</div>').join('')+'</div>'+(p.texto?'<details><summary>Mensagem que vai junto</summary><div class="msg a">'+esc(p.texto)+'</div></details>':'')+'<div class="acts"><button class="btn ok" onclick="aprovar(\''+p.pk+'\')">✓ Enviar ao cliente</button><button class="btn mid" onclick="alterar(\''+p.pk+'\')">✏️ Alterar</button><button class="btn mid" onclick="pdf(\''+p.pk+'\')">📄 Ver PDF</button><button class="btn bad" onclick="recusar(\''+p.pk+'\')">✕ Não enviar</button></div></div>').join(''):'<div class="card empty">Nenhuma proposta esperando aprovação 🎉</div>';return}
if(TAB=='atend'){let l=cli.slice();if(BUSCA)l=l.filter(c=>(nomeDe(c)+' '+c.fone+' '+(c.empresa||'')).toLowerCase().includes(BUSCA));
A.innerHTML='<div class="card" style="padding:10px"><input placeholder="Buscar cliente, empresa ou telefone" value="'+esc(BUSCA)+'" oninput="BUSCA=this.value.toLowerCase();render();const i=document.querySelector(\'#app input\');i.focus();i.setSelectionRange(i.value.length,i.value.length)"></div>'+(l.length?l.map(c=>'<div class="card"><div class="row"><h3>'+esc(nomeDe(c))+'</h3><span class="tag '+(c.estado=='humano'?'t-hum':'t-ia')+'">'+(c.estado=='humano'?'Com a equipe':'Com a IA')+'</span><span class="sp"></span><span class="mut">'+dt(c.ult)+'</span></div><div class="mut">'+tel(c.fone)+(c.empresa?' · '+esc(c.empresa):'')+(c.local?' · '+esc(c.local):'')+'</div>'+(c.resumo?'<div style="margin-top:8px;font-size:14px">'+esc(c.resumo)+'</div>':'')+(c.propostas&&c.propostas.length?'<div class="mut" style="margin-top:6px">Propostas: '+c.propostas.map(p=>'Nº '+esc(p.pk)+' ('+esc(p.total)+(p.pago?' · paga':'')+')').join(', ')+'</div>':'')+(c.hist&&c.hist.length?'<details><summary>Últimas mensagens</summary>'+c.hist.map(m=>'<div class="msg '+(m.r=='Cliente'?'c':'a')+'"><b>'+esc(m.r)+':</b> '+esc(m.x)+'</div>').join('')+'</details>':'')+'<div class="acts"><a class="btn mid" style="text-decoration:none" href="https://wa.me/'+String(c.fone).replace(/\D/g,'')+'" target="_blank">💬 WhatsApp</a>'+(c.estado=='humano'?'<button class="btn mid" onclick="iaRetoma(\''+c.fone+'\')">🤖 IA retomar</button>':'')+'<button class="btn mid" onclick="orc(\''+c.fone+'\')">📄 Montar proposta</button></div></div>').join(''):'<div class="card empty">Nenhum atendimento.</div>');return}
if(TAB=='pedidos'){A.innerHTML=ped.length?ped.map(p=>'<div class="card"><div class="row"><h3>Nº '+esc(p.pk)+' · '+esc(nomeDe({nome:p.nome,empresa:p.empresa,fone:p.cli}))+'</h3><span class="tag '+(p.pago?'t-pag':'t-env')+'">'+(p.pago?'Paga':'Enviada')+'</span><span class="sp"></span><span class="big">'+esc(p.total)+'</span></div><div class="mut">'+tel(p.cli)+' · '+dt(p.t)+'</div><div style="font-size:14px;margin-top:6px">'+esc(p.desc||'')+'</div><div class="acts"><button class="btn mid" onclick="pdf(\''+p.pk+'\')">📄 PDF</button><button class="btn mid" onclick="os(\''+p.pk+'\')">🛠️ Ordem de Serviço</button>'+(p.pago?'':'<button class="btn ok" onclick="pago(\''+p.pk+'\')">💰 Marcar paga</button>')+'</div></div>').join(''):'<div class="card empty">Nenhum pedido ainda.</div>';return}
if(TAB=='vendas'){const now=new Date(),mk=d=>d.getFullYear()+'-'+(d.getMonth()+1);const mes=ped.filter(p=>mk(new Date(p.t))==mk(now));const tot=mes.reduce((a,p)=>a+num(p.total),0),pg=mes.filter(p=>p.pago),totPg=pg.reduce((a,p)=>a+num(p.total),0);
const meses=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const l=ped.filter(p=>mk(new Date(p.t))==mk(d));meses.push({n:d.toLocaleDateString('pt-BR',{month:'short'}),e:l.reduce((a,p)=>a+num(p.total),0),p:l.filter(p=>p.pago).reduce((a,p)=>a+num(p.total),0)})}
const mx=Math.max(1,...meses.map(m=>m.e)),W=600,Hh=150,bw=W/6;let svg='<svg class="svg" viewBox="0 0 '+W+' '+(Hh+18)+'" width="100%">';meses.forEach((m,i)=>{const h1=m.e/mx*Hh,h2=m.p/mx*Hh,x=i*bw+bw*0.2;svg+='<rect x="'+x+'" y="'+(Hh-h1)+'" width="'+bw*0.28+'" height="'+h1+'" rx="3" fill="#00aeef"><title>Enviado '+brl(m.e)+'</title></rect><rect x="'+(x+bw*0.32)+'" y="'+(Hh-h2)+'" width="'+bw*0.28+'" height="'+h2+'" rx="3" fill="#16a34a"><title>Pago '+brl(m.p)+'</title></rect><text x="'+(i*bw+bw/2)+'" y="'+(Hh+14)+'" text-anchor="middle">'+m.n+'</text>'});svg+='</svg>';
A.innerHTML='<div class="kpis"><div class="kpi"><div class="l">Propostas no mês</div><div class="v">'+mes.length+'</div></div><div class="kpi"><div class="l">Valor proposto</div><div class="v">'+brl(tot)+'</div></div><div class="kpi"><div class="l">Pago no mês</div><div class="v" style="color:var(--ok)">'+brl(totPg)+'</div></div><div class="kpi"><div class="l">Ticket médio</div><div class="v">'+brl(mes.length?tot/mes.length:0)+'</div></div></div><div class="card"><div class="row"><h3>Últimos 6 meses</h3><span class="sp"></span><span class="mut"><span style="color:#00aeef">■</span> enviado <span style="color:#16a34a">■</span> pago</span></div>'+svg+'</div><div class="card"><div class="row"><b>Aguardando aprovação</b><span class="sp"></span><b>'+pend.length+'</b></div><div class="row" style="margin-top:6px"><b>Clientes com a equipe</b><span class="sp"></span><b>'+hum.length+'</b></div><div class="row" style="margin-top:6px"><b>Taxa de pagamento (mês)</b><span class="sp"></span><b>'+(mes.length?Math.round(pg.length/mes.length*100):0)+'%</b></div></div>'}}
const dlg=document.getElementById('dlg');try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
carregar();setInterval(()=>{if(!document.hidden&&!dlg.open)carregar()},60000);
</script></body></html>
